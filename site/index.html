<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>keygenjukebox.net</title>
	<meta name="description" content="A jukebox of keygen music. Just fans of beep boop music.">
	<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
	<meta property="og:title" content="keygenjukebox.net">
	<meta property="og:description" content="A jukebox of keygen music.">
	<meta property="og:image" content="https://keygenjukebox.net/img/cover.png">
	<link rel="icon" type="image/png" sizes="64x64" href="img/icon-64.png">
	<link rel="icon" type="image/svg+xml" href="img/icon.svg">
	<link rel="apple-touch-icon" href="img/icon-180.png">
	<link rel="stylesheet" href="style.css">
	<script src="app.js" defer></script>
</head>
<body>
	<main class="player">
		<div class="brand">
			<svg class="mascot" viewBox="0 0 25 16" aria-hidden="true">
				<path d="M8 0h9v2H8zM6 2h2v2H6zM17 2h2v2h-2zM4 4h2v12H4zM19 4h2v12h-2zM2 6h2v8H2zM21 6h2v8h-2zM0 8h2v4H0zM23 8h2v4h-2zM7 9h1v1H7zM17 9h1v1h-1zM7 12h11v1H7zM7 13h1v2H7zM17 13h1v2h-1zM8 15h9v1H8z"/>
			</svg>
			<span>keygenjukebox.net</span>
		</div>
		<canvas id="visualizer" aria-hidden="true"></canvas>
		<div id="seek" class="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
			<div id="seek-fill" class="seek-fill"></div>
		</div>

		<div class="controls">
			<button type="button" id="play" class="btn btn-lg" aria-label="Play">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<circle class="ring" cx="12" cy="12" r="10.75"/>
					<path class="icon-play" d="M9.75 7.5v9L17 12z"/>
					<path class="icon-pause" d="M8.5 7.75H11v8.5H8.5zM13 7.75h2.5v8.5H13z"/>
				</svg>
			</button>
			<button type="button" id="prev" class="btn" aria-label="Previous track">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<circle class="ring" cx="12" cy="12" r="10.75"/>
					<path d="M7.5 8.5H9v7H7.5zM13 8.5v7L9 12zM17 8.5v7L13 12z"/>
				</svg>
			</button>
			<button type="button" id="next" class="btn" aria-label="Next track">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<circle class="ring" cx="12" cy="12" r="10.75"/>
					<path d="M15 8.5h1.5v7H15zM11 8.5v7l4-3.5zM7 8.5v7l4-3.5z"/>
				</svg>
			</button>
			<button type="button" id="shuffle" class="btn" aria-label="Shuffle" aria-pressed="true">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<circle class="ring" cx="12" cy="12" r="10.75"/>
					<path class="stroke" d="M6.5 9H9c3 0 3.5 6 6.5 6h2M6.5 15H9c3 0 3.5-6 6.5-6h2M16 7.25 17.75 9 16 10.75M16 13.25 17.75 15 16 16.75"/>
				</svg>
			</button>
			<button type="button" id="mute" class="btn" aria-label="Mute" aria-pressed="false">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<circle class="ring" cx="12" cy="12" r="10.75"/>
					<path d="M6.75 10.25H9L12.25 7.5v9L9 13.75H6.75z"/>
					<path class="stroke icon-wave" d="M14.5 9.75a3.2 3.2 0 0 1 0 4.5"/>
					<path class="stroke icon-x" d="M14.25 10.25l3 3.5M17.25 10.25l-3 3.5"/>
				</svg>
			</button>
			<input type="range" id="volume" class="volume" min="0" max="1" step="0.05" value="0.5" aria-label="Volume">
			<div class="time"><span id="time-now">0:00</span> | <span id="time-total">0:00</span></div>
		</div>

		<p class="now">
			<span>Now Playing:</span>
			<button type="button" id="now-playing" title="Show in list" disabled>&mdash;</button>
		</p>

		<ul id="tracks" class="tracks">
			<li class="note">Loading&hellip;</li>
		</ul>
		<noscript><p class="note">The jukebox needs JavaScript to play music.</p></noscript>
	</main>

	<aside id="about" class="about" aria-label="About">
		<h2>ABOUT</h2>
		<p>We're just fans of beep boop music. Especially where we got this music archive from: the now-defunct keygenjukebox.com. If you own the copyright to any of these songs and want them taken down email <a href="mailto:admin@keygenjukebox.net">admin@keygenjukebox.net</a>.</p>
		<button type="button" id="dismiss" class="dismiss">DISMISS</button>
	</aside>
</body>
</html>
